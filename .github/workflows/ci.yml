name: Sahand Matrix CI & Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Tidy Dependencies & Verify
        run: |
          go mod tidy
          go vet ./...

      - name: Build Standalone Linux Binaries (Hub & Agent)
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/sahand-hub-linux-amd64 ./cmd/sahand-hub
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/sahand-agent-linux-amd64 ./cmd/sahand-agent

      - name: Upload Compiled Binaries
        uses: actions/upload-artifact@v4
        with:
          name: sahand-matrix-binaries
          path: dist/
